services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: EventHubDb
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  eventhub.api:
    image: eventhub.api
    build:
      context: .
      dockerfile: EventHub.Api/Dockerfile
    ports:
      - "8000:8080"
    environment:
      - ASPNETCORE_ENVIRONMENT=Docker
      - ConnectionStrings__DefaultConnection=Host=db;Port=5432;Database=EventHubDb;Username=postgres;Password=postgres
    depends_on:
      db:
        condition: service_healthy

  eventhub.web:
    image: eventhub.web
    build:
      context: .
      dockerfile: EventHub.Web/Dockerfile
    ports:
      - "8001:8080"
    environment:
      - ASPNETCORE_ENVIRONMENT=Docker
    depends_on:
      - eventhub.api